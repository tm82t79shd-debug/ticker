<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e5e5e5;
    overflow: hidden;
    display: flex;
    align-items: center;
    height: 100vh;
  }
  .ticker-wrap {
    width: 100%;
    overflow: hidden;
    background: transparent;
    border-bottom: 1px solid #1f1f1f;
    padding: 6px 0;
  }
  .ticker {
    display: flex;
    width: max-content;
    animation: scroll 150s linear infinite;
  }
  .ticker:hover { animation-play-state: paused; }
  .item {
    display: flex;
    align-items: center;
    white-space: nowrap;
    padding-right: 3.5rem;
    font-size: 13px;
    letter-spacing: 0.3px;
    color: #d4d4d4;
  }
  .flt-cat {
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    margin-right: 8px;
    font-size: 11px;
    letter-spacing: 0.5px;
  }
  .VFR  { background: rgba(34, 197, 94, 0.2);  color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.4); }
  .MVFR { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.4); }
  .IFR  { background: rgba(239, 68, 68, 0.2);  color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); }
  .LIFR { background: rgba(217, 70, 239, 0.2); color: #e879f9; border: 1px solid rgba(232, 121, 249, 0.4); }
  
  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<div class="ticker-wrap">
  <div class="ticker" id="ticker">
    <div class="item">Loading live METARs...</div>
  </div>
</div>

<script>
  const WORKER_URL = 'https://broken-credit-c0e4metar-proxy.wfwhy925kv.workers.dev/';
  const STATIONS = ['CYKF', 'CYYZ', 'CYUL', 'CYVR', 'CYZF', 'KCXO', 'KIAH', 'KLAX', 'KMIA', 'KMCO', 'KJFK', 'KORD', 'KSEA']; 
  const REFRESH_MINUTES = 15;

  function getCategoryFromRaw(raw) {
    let ceil = 99999;
    const cloudMatches = raw.match(/\b(BKN|OVC|VV)(\d{3})\b/g);
    if (cloudMatches) {
      for (const layer of cloudMatches) {
        const height = parseInt(layer.replace(/^(BKN|OVC|VV)/, ''), 10) * 100;
        if (height < ceil) ceil = height;
      }
    }

    let vis = 10;
    const smMatch = raw.match(/\b(P)?(?:(\d+)\s+)?(\d+\/\d+|\d+)SM\b/);
    if (smMatch) {
      if (smMatch === 'P') {
        vis = 10;
      } else {
        const whole = smMatch ? parseInt(smMatch, 10) : 0;
        const partStr = smMatch;
        let part = 0;
        if (partStr.includes('/')) {
          const pieces = partStr.split('/');
          part = Number(pieces) / Number(pieces);
        } else {
          part = parseFloat(partStr);
        }
        vis = whole + part;
      }
    } else if (/\b9999\b/.test(raw) || /\bCAVOK\b/.test(raw)) {
      vis = 10;
    } else {
      const mMatch = raw.match(/\s(\d{4})\s/);
      if (mMatch) vis = parseInt(mMatch, 10) / 1609.34;
    }

    if (ceil < 500 || vis < 1) return 'LIFR';
    if (ceil < 1000 || vis < 3) return 'IFR';
    if (ceil <= 3000 || vis <= 5) return 'MVFR';
    return 'VFR';
  }

  async function fetchMetars() {
    try {
      const res = await fetch(WORKER_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();

      const lines = text.trim().split('\n').map(l => l.trim()).filter(l => l.length > 10 && !l.startsWith('<'));
      if (!lines.length) throw new Error('No METAR lines returned');

      lines.sort((a, b) => {
        const idA = STATIONS.findIndex(s => a.startsWith(s));
        const idB = STATIONS.findIndex(s => b.startsWith(s));
        return (idA === -1 ? 99 : idA) - (idB === -1 ? 99 : idB);
      });

      const itemsHtml = lines.map(raw => {
        const cat = getCategoryFromRaw(raw);
        return `<div class="item"><span class="flt-cat ${cat}">${cat}</span><span>${raw}</span></div>`;
      }).join('');

      document.getElementById('ticker').innerHTML = itemsHtml + itemsHtml;
    } catch (err) {
      document.getElementById('ticker').innerHTML = 
        `<div class="item">Error: ${err.message}</div>`;
    }
  }

  fetchMetars();
  setInterval(fetchMetars, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
